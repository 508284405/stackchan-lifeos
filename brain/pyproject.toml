[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stackchan-brain"
version = "0.1.0"
description = "LangGraph cognitive brain for StackChan LifeOS"
requires-python = ">=3.10"
dependencies = ["langgraph>=0.6.11,<2", "pydantic>=2,<3", "fastapi>=0.116,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stackchan-brain = "brain.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["brain*"]
