[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stackchan-brain"
version = "0.1.0"
description = "LangGraph cognitive brain for StackChan LifeOS"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["langgraph>=0.6.11,<2", "pydantic>=2,<3", "fastapi>=0.116,<1", "cryptography>=43,<47"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stackchan-brain = "brain.cli:main"

[project.urls]
Homepage = "https://github.com/508284405/stackchan-lifeos"
Repository = "https://github.com/508284405/stackchan-lifeos"
Issues = "https://github.com/508284405/stackchan-lifeos/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["brain*"]
