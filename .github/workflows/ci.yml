name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install brain
        run: python -m pip install -e 'brain[dev]'
      - name: Validate schemas
        run: python tools/validate_schemas.py
      - name: Brain tests
        run: python -m pytest brain/tests -q
      - name: Firmware host tests
        run: |
          cmake -S firmware -B firmware/build -DSTACKCHAN_BUILD_TESTS=ON
          cmake --build firmware/build
          ctest --test-dir firmware/build --output-on-failure

